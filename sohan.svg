<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .status { fill: #8b949e; font-size: 11px; letter-spacing: 1.5px; }
    .name { fill: #f0f6fc; font-size: 26px; font-weight: 700; }
    .role { fill: #c9d1d9; font-size: 14px; }
    .label { fill: #6e7681; font-size: 11px; letter-spacing: 1px; }
    .stack { fill: #a5d6ff; font-size: 12px; }
    .pulse-dot { fill: #3fb950; animation: pulse 2.5s infinite ease-in-out; }
    .scanline { stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 120 700; stroke-dashoffset: 820; animation: scan 4s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes scan { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="798" height="168" x="1" y="1" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />

  <circle cx="34" cy="34" r="4" class="pulse-dot" />
  <text x="48" y="38" class="mono status">SYSTEMS & BACKEND ENGINEERING // BENGALURU, IN</text>

  <text x="30" y="78" class="sans name">Sohan S Naik</text>
  <text x="30" y="102" class="sans role">Building low-latency distributed systems, concurrent Go services, and Linux IPC tooling.</text>

  <line x1="30" y1="124" x2="770" y2="124" stroke="#21262d" stroke-width="1" />
  <line x1="30" y1="124" x2="770" y2="124" class="scanline" />

  <text x="30" y="148" class="mono label">RUNTIME</text>
  <text x="95" y="148" class="mono stack">Go · C · Python · Java</text>

  <text x="310" y="148" class="mono label">DOMAINS</text>
  <text x="380" y="148" class="mono stack">Concurrency · P2P/mDNS · RAG · Linux/Wayland</text>
</svg>
