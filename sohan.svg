<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 382" width="1450" height="382" role="img" aria-labelledby="title desc">
  <title id="title">Sohan S Naik — Systems and Backend Engineering</title>
  <desc id="desc">Profile banner describing Sohan S Naik's systems and backend engineering focus.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { fill: #9aa4b2; font-size: 16px; letter-spacing: 3px; }
    .name { fill: #edf3fb; font-size: 44px; font-weight: 700; }
    .role { fill: #c8d1dc; font-size: 24px; }
    .label { fill: #748092; font-size: 16px; letter-spacing: 2px; }
    .value { fill: #a9d5ff; font-size: 18px; font-weight: 600; }

    .status-dot {
      animation: pulse 2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .accent {
      animation: glow 3s ease-in-out infinite;
    }

    .profile-name {
      animation: fade-in 1s ease-out both;
    }

    .profile-role {
      animation: fade-in 1s ease-out 0.25s both;
    }

    .profile-meta {
      animation: fade-in 1s ease-out 0.5s both;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <rect width="1450" height="382" fill="#101010" />

  <rect x="45" y="35" width="1360" height="290" rx="58" fill="#0d1218" stroke="#1e2732" stroke-width="2" />
  <rect x="58" y="48" width="1334" height="264" rx="46" fill="none" stroke="#111820" stroke-width="2" />

  <circle class="status-dot" cx="102" cy="92" r="7" fill="#36a853" />
  <text x="126" y="98" class="mono eyebrow">SYSTEMS &amp; BACKEND ENGINEERING // BENGALURU, IN</text>

  <text x="95" y="166" class="sans name profile-name">Sohan S Naik</text>
  <text x="95" y="210" class="sans role profile-role">Building low-latency distributed systems, concurrent Go services, and Linux IPC tooling.</text>

  <line x1="95" y1="246" x2="1360" y2="246" stroke="#26303b" stroke-width="2" />
  <line class="accent" x1="265" y1="246" x2="470" y2="246" stroke="#4da3ff" stroke-width="3" />

  <g class="profile-meta">
    <text x="95" y="286" class="mono label">RUNTIME</text>
    <text x="206" y="286" class="mono value">Go · C · Python · Java</text>

    <text x="573" y="286" class="mono label">DOMAINS</text>
    <text x="694" y="286" class="mono value">Concurrency · P2P/mDNS · RAG · Linux/Wayland</text>
  </g>
</svg>
