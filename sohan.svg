<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Sohan S Naik</title>
<desc id="d">Go developer at Atria Institute of Technology, Bengaluru. Five peers connect in a mesh with no central server.</desc>
<rect x=".5" y=".5" width="879" height="251" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="40" y="70" font-size="36" font-weight="700" letter-spacing="-.5" fill="#e6edf3">Sohan S Naik</text>
<text x="40" y="96" font-size="14" fill="#8b949e">Atria Institute of Technology, Bengaluru</text>
<text x="40" y="144" font-size="19" font-weight="600" fill="#e6edf3">I build networked systems in Go.</text>
<text x="40" y="170" font-size="15" fill="#8b949e">Devices that find each other without a server,</text>
<text x="40" y="192" font-size="15" fill="#8b949e">and retrieval that answers in under 200 ms.</text>
<path d="M40 208H840" stroke="#30363d"/>
<text x="40" y="232" font-size="14" fill="#8b949e">Mostly Go. Some C, Python and Java.</text>
<text x="738" y="232" font-size="14" fill="#8b949e" text-anchor="middle">Five peers, no central server.</text>
<path d="M738 70L793 110 772 175 704 175 683 110Z M738 70L772 175 683 110 793 110 704 175Z" fill="none" stroke="#30363d"/>
